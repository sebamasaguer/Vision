services:
  postgres:
    image: postgres:16-alpine
    container_name: hysvision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hysvision_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hysvision_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6389:6379"
    volumes:
      - hysvision_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: hysvision_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9040:9000"
      - "9041:9001"
    volumes:
      - hysvision_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    image: hys-vision-v110-backend:latest
    build:
      context: ./backend
    container_name: hysvision_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8160}:8000"
    volumes:
      - ./models:/opt/hys-models
      - ./datasets:/opt/hys-datasets
      - ./demo:/demo:ro
      - ./reports:/reports
    command: >-
      sh -c "alembic upgrade head && python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20

  camera-worker:
    image: hys-vision-v110-backend:latest
    container_name: hysvision_camera_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./demo:/demo:ro
    command: ["python", "-m", "app.camera_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s

  vision-engine:
    image: hys-vision-v110-backend:latest
    container_name: hysvision_vision_engine
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      camera-worker:
        condition: service_healthy
    volumes:
      - ./models:/opt/hys-models:ro
      - ./datasets:/opt/hys-datasets:ro
      - ./demo:/demo:ro
      - ./reports:/reports
    command: ["python", "-m", "app.vision_engine"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.vision_worker_health"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s

  alert-worker:
    image: hys-vision-v110-backend:latest
    container_name: hysvision_alert_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.alert_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.alert_worker_health"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s

  trainer:
    profiles: ["training"]
    build:
      context: ./training/yolox
      args:
        YOLOX_REF: "0.3.0"
    image: hys-vision-v110-yolox-trainer:latest
    container_name: hysvision_trainer
    volumes:
      - ./datasets:/datasets
      - ./models:/models
      - ./training/runs:/runs
    environment:
      HYS_ULTRALYTICS_USED: "false"
    shm_size: "2gb"
    gpus: all

  frontend:
    image: hys-vision-v110-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8160}/api/v1
        VITE_EMAILJS_SERVICE_ID: ${VITE_EMAILJS_SERVICE_ID:-}
        VITE_EMAILJS_TEMPLATE_ID: ${VITE_EMAILJS_TEMPLATE_ID:-}
        VITE_EMAILJS_PUBLIC_KEY: ${VITE_EMAILJS_PUBLIC_KEY:-}
    container_name: hysvision_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      camera-worker:
        condition: service_healthy
      vision-engine:
        condition: service_healthy
      alert-worker:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/admin/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  hysvision_postgres_data:
  hysvision_redis_data:
  hysvision_minio_data:
