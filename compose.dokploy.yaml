# Compose de PRODUCCION para Dokploy.
#
# Diferencias respecto a compose.yaml (uso local):
#  - Sin "ports:" en redis/minio/backend/frontend: nada queda expuesto
#    directo al host. La exposicion publica de backend y frontend se configura
#    en Dokploy > tu app > pestana "Domains" (Dokploy inyecta las labels de
#    Traefik solo; ver docs/DEPLOY_DOKPLOY.md).
#  - datasets/, reports/ y models/ son volumenes nombrados (persisten entre
#    redeploys) en vez de bind mounts a ./datasets, ./reports, ./models: Dokploy
#    vuelve a clonar el repo en cada deploy y borraria esos bind mounts.
#  - demo/ sigue siendo bind mount desde el repo: es contenido estatico de
#    referencia, no algo que la app escriba en runtime.
#  - Postgres NO corre en este compose: es una base remota externa (ya
#    existente, con datos de produccion). DATABASE_URL apunta a esa base y se
#    define en el .env (ver docs/DEPLOY_DOKPLOY.md). REDIS_URL/MINIO_ENDPOINT
#    siguen fijos por la topologia interna del compose (nombres de servicio).
#  - Se quita el servicio "trainer" (GPU, solo para entrenar; no aplica a un
#    despliegue web en un VPS de Dokploy).
#  - Red interna explicita "hysvision_internal": no se deja la red default
#    implicita de Docker Compose. Los 7 servicios la comparten para resolverse
#    entre si por nombre (minio, redis, etc.).
#  - "dokploy-network" (externa, la crea Dokploy/Traefik, no este compose) se
#    suma ademas a backend y frontend -- son los unicos con Domain publico
#    asignado, y Traefik necesita estar en la misma red que ellos para
#    poder proxearles trafico. Sin esto se vio Bad Gateway en el dominio del
#    frontend aunque el contenedor estuviera sano puertas adentro.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks: [hysvision_internal]
    volumes:
      - hysvision_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    networks: [hysvision_internal]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - hysvision_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    image: hys-vision-v110-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    networks: [hysvision_internal, dokploy-network]
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - hysvision_models_data:/opt/hys-models
      - hysvision_datasets_data:/opt/hys-datasets
      - ./demo:/demo:ro
      - hysvision_reports_data:/reports
    command: >-
      sh -c "alembic upgrade head && python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20

  camera-worker:
    image: hys-vision-v110-backend:latest
    restart: unless-stopped
    env_file: .env
    networks: [hysvision_internal]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./demo:/demo:ro
    command: ["python", "-m", "app.camera_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s

  vision-engine:
    image: hys-vision-v110-backend:latest
    restart: unless-stopped
    env_file: .env
    networks: [hysvision_internal]
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      redis:
        condition: service_healthy
      camera-worker:
        condition: service_healthy
    volumes:
      - hysvision_models_data:/opt/hys-models:ro
      - hysvision_datasets_data:/opt/hys-datasets:ro
      - ./demo:/demo:ro
      - hysvision_reports_data:/reports
    command: ["python", "-m", "app.vision_engine"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.vision_worker_health"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s

  alert-worker:
    image: hys-vision-v110-backend:latest
    restart: unless-stopped
    env_file: .env
    networks: [hysvision_internal]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.alert_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.alert_worker_health"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s

  frontend:
    image: hys-vision-v110-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_EMAILJS_SERVICE_ID: ${VITE_EMAILJS_SERVICE_ID}
        VITE_EMAILJS_TEMPLATE_ID: ${VITE_EMAILJS_TEMPLATE_ID}
        VITE_EMAILJS_PUBLIC_KEY: ${VITE_EMAILJS_PUBLIC_KEY}
    restart: unless-stopped
    networks: [hysvision_internal, dokploy-network]
    depends_on:
      backend:
        condition: service_healthy
      camera-worker:
        condition: service_healthy
      vision-engine:
        condition: service_healthy
      alert-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

networks:
  hysvision_internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  hysvision_redis_data:
  hysvision_minio_data:
  hysvision_models_data:
  hysvision_datasets_data:
  hysvision_reports_data:
